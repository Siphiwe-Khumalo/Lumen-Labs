<!--
  Lumen Labs — Email Signature (HTML)

  Built for real-world email client compatibility (Outlook, Gmail, Apple Mail):
  table-based layout, inline styles only, no @font-face / custom fonts (email
  clients strip these), no background-images, no CSS positioning tricks.

  Type: falls back to system sans-serif stacks that are close in spirit to the
  website's Space Grotesk / Manrope / JetBrains Mono trio, since email clients
  cannot reliably load the brand's actual webfonts.

  Colours are the exact hex values from src/styles/index.css:
    --ink #06080a  --text #f3f2ee  --muted #98a1ac  --accent #e9b978  --steel #a9c8d8

  ============================================================================
  BEFORE USE — logo hosting (read this):
  Email clients block/strip embedded (base64) images from signatures far more
  aggressively than from regular email bodies, so this signature references
  the logo via a hosted URL rather than embedding it. Do ONE of the following:

    1. (Recommended) Upload `lumen-labs-mark-signature.png` (in this same
       folder) to the Lumen Labs site's `public/` folder and deploy, e.g.:
         https://lumenlabcreatives.spartangroup.co.za/lumen-labs-mark-signature.png
       then set LOGO_URL below to that address.
    2. Upload it to any static host/CDN you control and point LOGO_URL there.

  Until LOGO_URL points to a real, publicly reachable image, most email
  clients will show a broken image icon or nothing at all — this is normal
  and expected for any email signature logo, not specific to this file.
  ============================================================================
-->

      <!--
        LOGO_URL — replace with your hosted image URL (see note above).
        Width/height match the mark's 1:1 aspect ratio at signature scale.
      -->
      <img src="LOGO_URL"
           alt="Lumen Labs"
           width="46" height="46"
           style="display:block; border:0; border-radius:8px;" />
